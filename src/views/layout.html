<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <style>
      /* Colour: no theme toggle to maintain — the browser picks light or dark
         and every colour below is derived from currentColor. */
      :root { color-scheme: light dark; }

      /* Reading column: one comfortable measure, generous leading, and room to
         scroll past the last line so an ending never sits against the viewport. */
      body { margin: 0; font: 100%/1.7 system-ui, sans-serif; }
      main { max-width: 38rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
      h1 { line-height: 1.25; }

      /* Links and chrome: prose links inherit the text colour so a page dense
         with choices stays calm; the top bar is a hairline, not a header. */
      a { color: inherit; }
      nav.top a { text-decoration: none; }
      nav.top {
        padding: .5rem 1.25rem;
        border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent);
      }
    </style>
  </head>
  <body>
    <nav class="top"><a href="/">← Stories</a></nav>
    <main>
      {{body}}
    </main>
  </body>
</html>
